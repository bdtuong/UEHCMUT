name: VietCulture CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vietculture-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Next.js
        run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci


      - name: Deploy to homelab
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail

          cd /srv/vietculture/frontend

          git fetch origin main
          git merge --ff-only origin/main

          npm ci --legacy-peer-deps
          npm run build

          pm2 restart vietculture-frontend --update-env

          echo "Waiting for VietCulture to become ready..."

          healthy=0

          for i in {1..30}; do
            if curl --fail --silent --max-time 3 \
              http://127.0.0.1:3100/ > /dev/null 2>&1; then
              echo "VietCulture is healthy!"
              healthy=1
              break
            fi

            echo "Health check $i/30 failed; retrying..."
            sleep 2
          done

          if [ "$healthy" -ne 1 ]; then
            echo "VietCulture failed its health check."
            pm2 describe vietculture-frontend
            pm2 logs vietculture-frontend --lines 50 --nostream
            exit 1
          fi

          echo "VietCulture deployed successfully!"
          REMOTE
